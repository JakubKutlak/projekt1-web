<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" role="img" aria-labelledby="title desc">
  <title id="title">Schematický vývoj loga Instagramu</title>
  <desc id="desc">Čtyři karty zobrazují vývoj od retro fotoaparátu po současnou gradientovou ikonu.</desc>
  <defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ffd776"/><stop offset=".48" stop-color="#f56040"/><stop offset="1" stop-color="#833ab4"/></linearGradient></defs>
  <rect width="920" height="230" rx="18" fill="#faf4fa"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(12 12)"><rect width="214" height="206" rx="14" fill="#fff"/><text x="107" y="35" fill="#667085" font-size="16">2010</text><rect x="65" y="66" width="84" height="66" rx="12" fill="#8b694d"/><rect x="77" y="76" width="60" height="46" rx="5" fill="#eee2cf"/><circle cx="107" cy="99" r="17" fill="#69513c"/><circle cx="107" cy="99" r="10" fill="#c7d2d5"/><circle cx="139" cy="75" r="5" fill="#f8d34f"/><text x="107" y="173" fill="#667085" font-size="13">fotoaparát Polaroid</text></g>
    <g transform="translate(242 12)"><rect width="214" height="206" rx="14" fill="#fff"/><text x="107" y="35" fill="#667085" font-size="16">2011–2015</text><rect x="62" y="62" width="90" height="90" rx="20" fill="#f2eee8" stroke="#b8aaa0" stroke-width="5"/><rect x="72" y="76" width="70" height="61" rx="7" fill="#d98d44"/><circle cx="107" cy="106" r="21" fill="#514b4d"/><circle cx="107" cy="106" r="14" fill="#83a6af"/><circle cx="134" cy="82" r="6" fill="#e3bc54"/><text x="107" y="181" fill="#667085" font-size="13">retro fotoaparát</text></g>
    <g transform="translate(472 12)"><rect width="214" height="206" rx="14" fill="#fff"/><text x="107" y="35" fill="#667085" font-size="16">2016</text><rect x="64" y="64" width="86" height="86" rx="23" fill="url(#ig)"/><rect x="82" y="82" width="50" height="50" rx="15" fill="none" stroke="#fff" stroke-width="6"/><circle cx="107" cy="107" r="12" fill="none" stroke="#fff" stroke-width="5"/><circle cx="133" cy="81" r="4" fill="#fff"/><text x="107" y="181" fill="#667085" font-size="13">gradientová ikona</text></g>
    <g transform="translate(702 12)"><rect width="206" height="206" rx="14" fill="#fff"/><text x="103" y="35" fill="#667085" font-size="16">dnes</text><rect x="62" y="62" width="82" height="82" rx="23" fill="url(#ig)"/><rect x="79" y="79" width="48" height="48" rx="14" fill="none" stroke="#fff" stroke-width="6"/><circle cx="103" cy="103" r="11" fill="none" stroke="#fff" stroke-width="5"/><circle cx="128" cy="78" r="4" fill="#fff"/><text x="103" y="181" fill="#667085" font-size="13">zjednodušená ikona</text></g>
  </g>
</svg>
