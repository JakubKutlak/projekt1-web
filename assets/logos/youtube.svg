<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" role="img" aria-labelledby="title desc">
  <title id="title">Schematický vývoj loga YouTube</title>
  <desc id="desc">Čtyři karty zobrazují původní wordmark, červené tlačítko a samostatný symbol přehrávání.</desc>
  <rect width="920" height="230" rx="18" fill="#fff5f5"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(12 12)"><rect width="214" height="206" rx="14" fill="#fff"/><text x="107" y="35" fill="#667085" font-size="16">2005</text><text x="107" y="113" fill="#222" font-size="34" font-weight="bold">You</text><rect x="145" y="79" width="46" height="38" rx="8" fill="#c4302b"/><text x="168" y="106" fill="#fff" font-size="20" font-weight="bold">T</text><text x="107" y="173" fill="#667085" font-size="13">You + Tube</text></g>
    <g transform="translate(242 12)"><rect width="214" height="206" rx="14" fill="#fff"/><text x="107" y="35" fill="#667085" font-size="16">2011</text><text x="107" y="116" fill="#222" font-size="31" font-weight="bold">You</text><rect x="144" y="78" width="58" height="43" rx="10" fill="#e62117"/><text x="172" y="108" fill="#fff" font-size="22" font-weight="bold">Tube</text><text x="107" y="173" fill="#667085" font-size="13">červený blok</text></g>
    <g transform="translate(472 12)"><rect width="214" height="206" rx="14" fill="#fff"/><text x="107" y="35" fill="#667085" font-size="16">2017</text><rect x="67" y="72" width="80" height="58" rx="15" fill="#ff0033"/><path d="m99 84 29 17-29 17z" fill="#fff"/><text x="107" y="173" fill="#667085" font-size="13">samostatné tlačítko</text></g>
    <g transform="translate(702 12)"><rect width="206" height="206" rx="14" fill="#fff"/><text x="103" y="35" fill="#667085" font-size="16">dnes</text><rect x="64" y="72" width="78" height="58" rx="15" fill="#ff0033"/><path d="m95 84 29 17-29 17z" fill="#fff"/><text x="103" y="173" fill="#667085" font-size="13">červená ikona přehrání</text></g>
